name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Stdio end-to-end smoke test
        run: pnpm test:stdio

      - name: Context benchmark v0 smoke test
        run: pnpm benchmark:context

      - name: Context benchmark v1 smoke test
        run: pnpm benchmark:context:v1

      - name: Context benchmark v2 smoke test
        run: pnpm benchmark:context:v2

      - name: Capsule cache benchmark smoke test
        run: pnpm benchmark:capsule-cache:v1

      - name: Google Calendar fixture benchmark smoke test
        run: pnpm benchmark:google-calendar:v1

      - name: Markdown authoritative ingestion benchmark smoke test
        run: pnpm benchmark:markdown:v1

      - name: Immutable replication benchmark smoke test
        run: pnpm benchmark:replication:v0

      - name: Prefix Merkle replication benchmark smoke test
        run: pnpm benchmark:replication:merkle:v1

      - name: Bounded reconciliation session benchmark smoke test
        run: pnpm benchmark:replication:sync:v1

      - name: Policy-scoped replication access benchmark smoke test
        run: pnpm benchmark:replication:access:v1

      - name: Principal-scoped artifact blob replication benchmark smoke test
        run: pnpm benchmark:replication:blob-access:v1

      - name: Replication HTTP transport benchmark smoke test
        run: pnpm benchmark:replication:http:v1

      - name: Opaque encrypted replication overhead benchmark smoke test
        run: pnpm benchmark:replication:encrypted:v1

      - name: Opaque Merkle reconciliation benchmark smoke test
        run: pnpm benchmark:replication:opaque:v1

      - name: Durable opaque replication store catalog benchmark smoke test
        run: pnpm benchmark:replication:opaque-store:v1

      - name: Incremental opaque Merkle materialization benchmark smoke test
        run: pnpm benchmark:replication:opaque-incremental-merkle:v1
